<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-audiencias", "paleta": {"marino": "#003F5E", "teal": "#30615B", "oxido": "#30615B", "coral": "#8CD147", "crema": "#FBFBC5", "niebla": "#E5F2F3", "hielo": "#FDFDE2", "celeste": "#E5F2F3", "madera": "#30615B", "piso": "#E5F2F3", "gris": "#D6E4E2", "amarillo": "#8CD147"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[15, 80], [30, 80], [45, 80], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[22, 22], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "leccion_rotulo": "Lección 1", "unit": 1, "lesson": 1, "heading": "Lección 1. Finalidad y razones de política criminal de la Ley 1826 de 2017", "scenes": [{"layout": "lamina", "segmentos": ["Objetivo de la lección: Comprender y analizar los fundamentos de política criminal, las razones normativas y las lecciones constitucionales que motivaron la expedición de la Ley 1826 de 2017, identificando la finalidad de descongestión judicial, simplificación procesal y respuesta oportuna a las víctimas, para garantizar la imparcialidad judicial y el debido proceso."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros", "acomp": ["escudo", "documento"]}]}], "rotulo": null, "seccion": "Lección 1. Finalidad y razones de política criminal de la Ley 1826 de 2017", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Finalidad y razones de política criminal de la Ley 1826 de 2017", "ilustracion": "p-dialogo-carpeta.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "p-dialogo-carpeta.webp", "pos": "izq"}}, {"layout": "esquema", "segmentos": ["El procedimiento penal especial abreviado fue introducido en Colombia mediante la Ley 1826 de 2017 y constituye una reforma estructural del sistema penal colombiano al determinar un procedimiento que se puede entender como paralelo al de la Ley 906 de 2004 e incorporar una herramienta procedimental dirigida a las víctimas: el acusador privado. Esta figura tiene el propósito de enfrentar los altos índices de congestión judicial e impunidad que caracterizan al sistema acusatorio tradicional, sobre todo frente a conductas punibles de menor lesividad, pero de alta ocurrencia y sensibilidad social.", "La finalidad primordial de este procedimiento especial es simplificar y acelerar el trámite procesal mediante la reducción de las etapas y audiencias judiciales que pueden resultar innecesarias para los delitos en los cuales procede. Su objetivo es garantizar una pronta y efectiva administración de justicia, con respuesta ágil a las víctimas. Con ella se transita de un modelo de justicia de ritual basado en las audiencias hacia uno en el que la fase inicial de vinculación e investigación se desarrolla en su mayor parte por escrito y de forma directa.", "Este nuevo modelo reserva la intervención judicial para el debate probatorio y la resolución de la situación jurídica sustancial."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una reforma estructural", "segs": [0], "obj": "libros"}, {"label": "La finalidad primordial", "segs": [1, 2], "obj": "escudo"}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una reforma estructural", "La finalidad primordial"], "titulo_genially": "Introducción", "ilustracion": "fundamento-documento.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "fundamento-documento.webp", "pos": "fondo"}}, {"layout": "puntos", "segmentos": ["La Ley 1826 de 2017 entró en vigencia plena el 13 de julio de 2017. El ámbito temporal de aplicación se rige por las siguientes reglas operativas:", "a) Conductas cometidas con posterioridad al 13 de julio de 2017: se tramitan de forma obligatoria y exclusiva por el trámite abreviado, siempre que la conducta esté incluida en el catálogo de procedencia.", "b) Conductas cometidas con anterioridad al 13 de julio de 2017: se tramitan bajo el procedimiento abreviado únicamente si a la fecha de entrada en vigencia de la ley no se había formulado imputación de cargos conforme al procedimiento ordinario de la Ley 906 de 2004. Si ya existía imputación, el proceso debe culminar bajo la cuerda del procedimiento ordinario."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Vigencia plena", "segs": [0, 1], "obj": "libros"}, {"label": "Conductas cometidas con anterioridad al 13", "segs": [2], "obj": "reloj"}]}], "rotulo": null, "seccion": "1. Vigencia y ámbito temporal de aplicación", "grupo": null, "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Vigencia plena", "Conductas cometidas con anterioridad al 13"], "titulo_genially": "Vigencia y ámbito temporal de aplicación", "ilustracion": "fundamento-documento.webp", "relleno": "fundamento-documento.webp"}, {"layout": "esquema", "segmentos": ["La búsqueda de un trámite procesal expedito para combatir la delincuencia de menor cuantía y descongestionar los despachos judiciales es una constante en la política criminal colombiana. Sin embargo, el antecedente de la Sentencia C-364 de 1996 fijó los límites constitucionales insalvables para estas iniciativas.", "Al declarar inexequible el artículo 10 de la Ley 228 de 1995, que pretendía procesar el hurto calificado menor a diez salarios mínimos como una contravención especial, la Corte Constitucional advirtió que la celeridad procesal no puede alcanzarse despojando a la persona procesada de sus garantías fundamentales ni desfigurando el equilibrio del proceso penal. ​ ​ El tribunal censuró con vehemencia que dicha ley mantuviera penas severas de prisión (de hasta ocho años) mientras suprimía la separación de funciones entre acusación y juzgamiento al acumularlas en el juez o la jueza municipal.", "Además, limitaba las oportunidades probatorias y eliminaba el acceso a beneficios sustanciales como la condena de ejecución condicional y la libertad provisional. La Corte estableció así una regla de oro: si el legislador o legisladora considera que una conducta amerita una represión penal severa, está constitucionalmente obligado(a) a preservar la imparcialidad judicial y la plenitud de las formas del juicio oral y acusatorio.", "Dos décadas después, la Ley 1826 de 2017, que introdujo el procedimiento penal especial abreviado, redefinió este panorama político-criminal al aprender de los errores de diseño constitucional expuestos en 1996. A diferencia de la Ley 228 de 1995, que sacrificaba garantías para ganar rapidez, la Ley 1826 de 2017 racionaliza el proceso penal sin fusionar las funciones judiciales ni menoscabar los derechos de la persona procesada.", "El procedimiento abreviado mantiene intactas las competencias de jueces de conocimiento y jueces de control de garantías, pero simplifica los ritos procesales al eliminar la audiencia oral de formulación de imputación y sustituirla por el traslado directo y por escrito de la acusación a la defensa.", "Esto reduce de forma drástica el número de audiencias previas y protege el núcleo del derecho de defensa y la contradicción, en consonancia con la advertencia de la Corte de que los trámites no deben demorarse de forma injustificada, pero tampoco acelerarse al anular la estructura procesal de garantías."], "parrafo": [0, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una constante en la política criminal", "segs": [0, 1], "obj": "libros"}, {"label": "Limitaba las oportunidades probatorias", "segs": [2], "obj": "puertaAbierta"}, {"label": "Dos décadas después", "segs": [3, 4, 5], "obj": "escudo"}]}], "rotulo": null, "seccion": "2. Razones político-criminales", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una constante en la política criminal", "Limitaba las oportunidades probatorias", "Dos décadas después"], "titulo_genially": "Razones político-criminales (1 de 2)", "ilustracion": "p-alto-documento.webp", "relleno": "terminos-reloj.webp", "arte": {"img": "p-alto-documento.webp", "pos": "izq"}}, {"layout": "fichas", "segmentos": ["El segundo pilar político-criminal de la Ley 1826 de 2017 es la incorporación de la figura del acusador privado. Este es un mecanismo que permite la conversión de la acción penal pública a privada para que la víctima, representada por su abogado o abogada de confianza o por un consultorio jurídico, lidere de manera directa la persecución de conductas punibles menores (como el hurto simple, la estafa o las lesiones personales culposas). A diferencia del esquema desvirtuado en la Sentencia C-364 de 1996, el acusador privado preserva la estricta escisión entre la parte acusadora y el tercero imparcial que decide.", "La FGN conserva la titularidad preferente y constitucional de la acción penal, pero delega el rol de acusación activa en el particular, lo que impide la concentración de poderes inquisitivos en quien ejerce como juzgador.", "Finalmente, la Ley 1826 de 2017 se ajusta a la proporcionalidad exigida por la doctrina constitucional al no consagrar un régimen punitivo o de beneficios regresivos en comparación con el procedimiento penal ordinario. Mientras que la legislación de 1995 cercenaba el acceso a subrogados penales y libertades provisionales para los ritos rápidos, el procedimiento abreviado de 2017 equilibra la agilidad procedimental[^1] con incentivos procesales y beneficios sustanciales amplios por la aceptación temprana de cargos.", "De este modo, la reforma plantea un modelo en el que la celeridad judicial y la oralidad no se construyen como herramientas de excepción o castigo procedimental, sino como una fórmula legítima de descongestión judicial que respeta los límites del arbitrio penal delineados por la jurisprudencia constitucional colombiana.", "[^1] Proyecto de Ley 048, 2015."], "parrafo": [0, 2, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Figura del acusador privado", "segs": [0, 1], "obj": "libros"}, {"label": "Proporcionalidad exigida", "segs": [2, 3, 4], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "2. Razones político-criminales", "grupo": null, "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Figura del acusador privado", "Proporcionalidad exigida"], "titulo_genially": "Razones político-criminales (2 de 2)", "ilustracion": "terminos-reloj.webp", "relleno": "dialogo-carpeta.webp"}]}</script>
