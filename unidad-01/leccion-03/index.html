nica de las conductas entre delitos querellables (grupo I) e investigables de oficio (grupo II) y la aplicación de la regla obligatoria de flagrancia, con el fin de seleccionar la ruta procesal adecuada y evitar interpretaciones analógicas no autorizadas por la ley."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros", "acomp": ["escalones", "documento"]}]}], "rotulo": null, "seccion": "Lección 3. Ámbito de aplicación: delitos querellables y catálogo de oficiosos", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Ámbito de aplicación: delitos querellables y catálogo de oficiosos", "ilustracion": "p-lee-libro.webp", "relleno": "clasificacion-carpetas.webp", "arte": {"img": "p-lee-libro.webp", "pos": "izq"}}, {"layout": "lamina", "segmentos": ["El ámbito de aplicación del procedimiento penal especial abreviado está estrictamente delimitado por el artículo 534 de la Ley 906 de 2004, adicionado por el artículo 10 de la Ley 1826 de 2017 y modificado por leyes posteriores, como la Ley 2197 de 2022. Este catálogo tiene un carácter taxativo, lo que significa que el o la fiscal no puede aplicar este trámite por analogía a delitos que no estén consagrados expresamente en la norma."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Ámbito de aplicación", "segs": [0], "obj": "libros", "acomp": ["escalones", "documento"]}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Ámbito de aplicación"], "titulo_genially": "Introducción", "ilustracion": "p-dialogo-carpeta-2.webp", "relleno": "fundamento-documento.webp"}, {"layout": "esquema", "segmentos": ["Las conductas punibles sujetas a este procedimiento se dividen en dos grandes grupos según la naturaleza de la acción penal:", "1.1.", "Grupo I: delitos que requieren querella para el inicio de la acción penal o querellables.[^2]​ Se rigen por el artículo 74 del CPP.", "Al requerir la manifestación expresa de la voluntad de la víctima para iniciar la acción penal, suponen una dinámica procesal particular sujeta a la caducidad de la querella y a la obligatoriedad de conciliación previa.", "Ejemplos representativos de esta categoría incluyen la injuria, la calumnia, el abuso de confianza ordinario, el daño en bien ajeno y las lesiones personales sin secuelas permanentes."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Dos grandes grupos", "segs": [0], "obj": "escalones"}, {"label": "1.1", "segs": [1], "obj": "documento"}, {"label": "Grupo I", "segs": [2], "obj": "carpetas"}, {"label": "Al requerir la manifestación expresa", "segs": [3], "obj": "escudo"}, {"label": "Ejemplos representativos de esta", "segs": [4], "obj": "reloj"}]}], "rotulo": null, "seccion": "1. Clasificación de los delitos del procedimiento abreviado", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Dos grandes grupos", "1.1", "Grupo I", "Al requerir la manifestación expresa", "Ejemplos representativos de esta"], "titulo_genially": "Clasificación de los delitos del procedimiento abreviado (1 de 5)", "ilustracion": "clasificacion-carpetas.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "clasificacion-carpetas.webp", "pos": "fondo"}}, {"layout": "rejilla", "segmentos": ["[^2] Artículo 74. Conductas punibles que requieren querella [Artículo modificado por el artículo 22 de la Ley 2197 de 2022. Corregido por el artículo 10 del Decreto 207 de 2022]. Para iniciar la acción penal será necesario querella en las siguientes conductas punibles: 1. Aquellas que de conformidad con el CP no tienen señalada pena privativa de la libertad, con excepción de: ofrecimiento, venta o compra de instrumento apto para interceptar la comunicación privada entre personas (art. 193); divulgación y empleo de documentos reservados (art. 194); abuso de autoridad por acto arbitrario e injusto (art. 416); revelación de secreto (art. 418);", "utilización de secreto o reserva (art. 419); utilización indebida de información oficial privilegiada (art. 420); asesoramiento y otras actuaciones ilegales (art. 421); utilización indebida de información obtenida en el ejercicio de función pública (art. 431); utilización indebida de influencias derivadas del ejercicio de función pública (art. 432). 2. Inducción o ayuda al suicidio (art. 107); lesiones personales sin secuelas que produjeren incapacidad para trabajar o enfermedad sin exceder de sesenta (60) días (art. 112, incisos 1 y 2); lesiones personales con deformidad física transitoria (art. 113, inciso 1);", "lesiones personales con perturbación funcional transitoria (art. 114, inciso 1); parto o aborto preterintencional (art. 118); lesiones personales culposas (art. 120); omisión de socorro (art. 131); violación a la libertad religiosa (art. 201); injuria (art. 220); calumnia (art. 221); injuria y calumnia indirecta (art. 222); injuria por vías de hecho (art. 226); injurias recíprocas (art. 227); maltrato mediante restricción a la libertad física (art. 230); malversación y dilapidación de los bienes de familiares (art. 236);", "hurto simple cuya cuantía no exceda de ciento cincuenta (150) salarios mínimos mensuales legales vigentes (art. 239, inciso 2); alteración, desfiguración y suplantación de marcas de ganado (art. 243); estafa cuya cuantía no exceda de ciento cincuenta (150) salarios mínimos mensuales legales vigentes (art. 246, inciso 3); emisión y transferencia ilegal de cheques (art. 248); abuso de confianza (art. 249); aprovechamiento de error ajeno o caso fortuito (art. 252); alzamiento de bienes (art. 253); disposición de bien propio gravado con prenda (art. 255); defraudación de fluidos (art. 256);", "acceso ilegal de los servicios de telecomunicaciones (art. 257); malversación y dilapidación de bienes (art. 259); usurpación de tierras (art. 261); usurpación de aguas (art. 262); invasión de tierras o edificaciones, cuando el avalúo del inmueble no exceda de ciento cincuenta (150) salarios mínimos mensuales legales vigentes (art. 263); perturbación de la posesión sobre inmuebles (art. 264); daño en bien ajeno (art. 265); uso y recargo de ventas a plazo (art. 305); falsa autoacusación (art. 437); infidelidad a los deberes profesionales (art. 445); violación de los derechos de reunión y asociación (art. 200). PARÁGRAFO 1o.", "No será necesario querella para iniciar la acción penal respecto de casos de flagrancia o en los cuales el sujeto pasivo sea menor de edad, inimputable o se refieran a presuntas conductas punibles de violencia contra la mujer. PARÁGRAFO 2o. No será necesaria la querella, cuando el delito de invasión de tierras o edificaciones recaiga sobre bienes del Estado."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Conductas punibles que requieren querella", "segs": [0], "obj": "puertaCerrada", "ilus": "fundamento-documento.webp"}, {"label": "utilización de secreto o reserva", "segs": [1], "obj": "escudo", "ilus": "investigacion-lupa.webp"}, {"label": "lesiones personales con perturbación funcional transitoria", "segs": [2], "obj": "puertaAbierta", "ilus": "alto-documento.webp"}, {"label": "hurto simple cuya", "segs": [3], "obj": "documento", "ilus": "revisan-documento.webp"}, {"label": "acceso ilegal de los servicios de telecomunicaciones", "segs": [4], "obj": "telefono", "ilus": "terminos-reloj.webp"}, {"label": "necesario querella para iniciar la acción penal", "segs": [5], "obj": "personas", "ilus": "captura-detenido.webp"}]}], "rotulo": null, "seccion": "1. Clasificación de los delitos del procedimiento abreviado", "grupo": null, "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Conductas punibles que requieren querella", "utilización de secreto o reserva", "lesiones personales con perturbación funcional transitoria", "hurto simple cuya", "acceso ilegal de los servicios de telecomunicaciones", "necesario querella para iniciar la acción penal"], "titulo_genially": "Clasificación de los delitos del procedimiento abreviado (2 de 5)", "ilustracion": "alto-documento.webp", "relleno": "clasificacion-carpetas.webp"}, {"layout": "puntos", "segmentos": ["1.2. Grupo II: catálogo taxativo de delitos investigables de oficio Son aquellas conductas punibles descritas en el numeral 2[^3] del artículo 534 del CPP. Aunque son delitos que se investigan de oficio (no requieren querella), se consideró pertinente darles el trámite abreviado debido a su menor complejidad o su alta frecuencia de judicialización. El catálogo vigente comprende:", "[^3] 2. Lesiones personales a las que hacen referencia los artículos 111, 112, 113, 114, 115, 116, 118 y 120 del CP; actos de discriminación (art. 134A del CP); hostigamiento agravado (art. 134C del CP); VIF (art. 229 del CP); inasistencia alimentaria (art. 233 del CP); hurto (art. 239 del CP), hurto calificado (art. 240 del CP), hurto agravado (art. 241 del CP, numerales del 1 al 10); estafa (art. 246 del CP); abuso de confianza (art. 249 del CP); corrupción privada (art. 250A del CP); administración desleal (art. 250B del CP); abuso de condiciones de inferioridad (art. 251 del CP);", "utilización indebida de información privilegiada en particulares (art. 258 del CP); invasión de tierras o edificaciones (art. 263 del CP); los delitos contenidos en el Título VII Bis, para la protección de la información y los datos, excepto los casos en los que la conducta recaiga sobre bienes o entidades del Estado; violación de derechos morales de autor (art. 270 del CP); violación de derechos patrimoniales de autor y derechos conexos (art. 271 del CP); violación a los mecanismos de protección de derechos de autor (art. 272 del CP); falsedad en documento privado (arts. 289 y 290 del CP);", "usurpación de derechos de propiedad industrial y de derechos de obtentores de variedades vegetales (art. 306 del CP); uso ilegítimo de patentes (art. 307 del CP); violación de reserva industrial y comercial (art. 308 del CP); ejercicio ilícito de actividad monopolística de arbitrio rentístico (art. 312 del CP).", "a) Lesiones personales específicas: aquellas contempladas en los artículos 111, 112, 113, 114, 115, 116, 118 y 120 del CP."], "parrafo": [0, 1, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Catálogo taxativo", "segs": [0, 1, 2, 3], "obj": "escalones"}, {"label": "Lesiones personales específicas", "segs": [4], "obj": "personas"}]}], "rotulo": null, "seccion": "1. Clasificación de los delitos del procedimiento abreviado", "grupo": null, "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Catálogo taxativo", "Lesiones personales específicas"], "titulo_genially": "Clasificación de los delitos del procedimiento abreviado (3 de 5)", "ilustracion": "clasificacion-carpetas.webp", "relleno": "clasificacion-carpetas.webp"}, {"layout": "fichas", "segmentos": ["b) VIF: artículo 229 del CP. Es el delito de mayor impacto en esta categoría y cuenta con directrices institucionales específicas (Directiva 0001 de 2021).", "c) Inasistencia alimentaria: artículo 233 del CP. Delito de omisión que tiene un trámite abreviado riguroso.", "d) Hurto simple, calificado y agravado; artículos 239, 240 y 241 (numerales 1 a 10) del CP. Es fundamental verificar que la agravación o calificación de la conducta no supere los límites del catálogo.", "e) Estafa y abuso de confianza: artículos 246 y 249 del CP, respectivamente."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "artículo 229", "segs": [0], "obj": "documento"}, {"label": "Inasistencia alimentaria", "segs": [1, 2], "obj": "escalones"}, {"label": "Estafa y abuso de confianza", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "1. Clasificación de los delitos del procedimiento abreviado", "grupo": null, "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["artículo 229", "Inasistencia alimentaria", "Estafa y abuso de confianza"], "titulo_genially": "Clasificación de los delitos del procedimiento abreviado (4 de 5)", "ilustracion": "alto-documento.webp", "relleno": "revisan-documento.webp", "arte": {"img": "alto-documento.webp", "pos": "izq"}}, {"layout": "giro", "segmentos": ["f) Delitos contra los derechos de autor: violación de derechos morales de autor (art. 270 del CP), violación de derechos patrimoniales de autor y derechos conexos (art. 271 del CP) y violación a mecanismos de protección (art. 272 del CP).", "g) Falsedad en documento privado: artículos 289 y 290 del CP.", "h) Delitos informáticos (Título VII Bis del CP): delitos contra la confidencialidad, la integridad y la disponibilidad de los datos y de los sistemas informáticos, salvo cuando la conducta recaiga sobre bienes o entidades del Estado.", "Parágrafo sobre flagrancia. En el parágrafo del artículo 534 se establece que el procedimiento especial abreviado se aplicará de forma obligatoria en todos los casos de flagrancia para los delitos contemplados en el catálogo. Esto significa que la captura en flagrancia de un sujeto cometiendo un hurto calificado o un acto de VIF activa inmediatamente la ruta del procedimiento abreviado, con los términos y especificidades procesales que la flagrancia impone (por ejemplo, control judicial de aprehensión dentro de las 36 horas)."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Delitos contra los derechos de autor", "segs": [0], "obj": "escudo"}, {"label": "Falsedad en documento privado", "segs": [1], "obj": "documento"}, {"label": "Delitos informáticos (Título VII Bis del CP)", "segs": [2], "obj": "computador"}, {"label": "Parágrafo sobre flagrancia", "segs": [3], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "1. Clasificación de los delitos del procedimiento abreviado", "grupo": null, "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Delitos contra los derechos de autor", "Falsedad en documento privado", "Delitos informáticos (Título VII Bis del CP)", "Parágrafo sobre flagrancia"], "titulo_genially": "Clasificación de los delitos del procedimiento abreviado (5 de 5)", "ilustracion": "p-trio-3.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "p-trio-3.webp", "pos": "izq"}}]}</script>
