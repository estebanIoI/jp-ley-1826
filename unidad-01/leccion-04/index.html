<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-audiencias", "paleta": {"marino": "#003F5E", "teal": "#30615B", "oxido": "#30615B", "coral": "#8CD147", "crema": "#FBFBC5", "niebla": "#E5F2F3", "hielo": "#FDFDE2", "celeste": "#E5F2F3", "madera": "#30615B", "piso": "#E5F2F3", "gris": "#D6E4E2", "amarillo": "#8CD147"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[15, 80], [30, 80], [45, 80], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[22, 22], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "leccion_rotulo": "Lección 4", "unit": 1, "lesson": 4, "heading": "Lección 4. Régimen de concursos: delimitación de rutas procesales", "scenes": [{"layout": "lamina", "segmentos": ["Objetivo de la lección: Analizar y aplicar las reglas de solución de concursos de conductas punibles en el procedimiento penal especial abreviado (Ley 1826 de 2017), así como determinar la prevalencia procedimental adecuada y dominar la técnica de formulación de los HJR bajo el estándar de probabilidad de verdad (art. 336 del CPP), con el fin de garantizar el derecho de defensa y prevenir vicios de nulidad por falta de competencia funcional o imprecisión en la acusación."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros", "acomp": ["escudo", "escalones"]}]}], "rotulo": null, "seccion": "Lección 4. Régimen de concursos: delimitación de rutas procesales", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Régimen de concursos: delimitación de rutas procesales", "ilustracion": "p-trio-1.webp", "relleno": "explica-brazos.webp", "arte": {"img": "p-trio-1.webp", "pos": "izq"}}, {"layout": "lamina", "segmentos": ["Cuando una misma situación fáctica involucra la presunta comisión de múltiples conductas punibles (concurso de delitos), el o la fiscal debe realizar un riguroso análisis procedimental para determinar qué ruta procesal debe seguirse. La Ley 1826 de 2017 establece reglas de prevalencia absoluta para evitar la fragmentación de las investigaciones."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "concurso de delitos", "segs": [0], "obj": "libros", "acomp": ["lupa", "documento"]}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["concurso de delitos"], "titulo_genially": "Introducción", "ilustracion": "p-dialogo-carpeta-2.webp", "relleno": "investigacion-lupa.webp"}, {"layout": "ruta", "segmentos": ["El inciso segundo del artículo 534 del CPP consagra con claridad la regla de resolución de conflictos procedimentales: \"en caso de concurso entre las conductas punibles referidas en los numerales anteriores [procedimiento abreviado] y aquellas a las que se les aplica el procedimiento ordinario, la actuación se regirá por este último”.", "Esta disposición significa que, ante la concurrencia de cualquier delito del procedimiento ordinario (por ejemplo, homicidio, secuestro, porte ilegal de armas de fuego de defensa personal) junto con un delito del catálogo abreviado (por ejemplo, hurto calificado o lesiones personales), quien ejerza como fiscal debe tramitar la totalidad de la actuación procesal de los delitos concursantes bajo el procedimiento ordinario de la Ley 906 de 2004 (por ejemplo, en el caso de concurso entre los artículos 229 y 365 de la Ley 599 de 2000, corresponde su conocimiento al juez penal del circuito bajo procedimiento ordinario)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "inciso segundo del artículo 534", "segs": [0], "obj": "escalones"}, {"label": "procedimiento ordinario de la Ley 906 de 2004", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "1. Regla de prevalencia del procedimiento ordinario (abreviado + ordinario)", "grupo": null, "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["inciso segundo del artículo 534", "procedimiento ordinario de la Ley 906 de 2004"], "titulo_genially": "Regla de prevalencia del procedimiento ordinario (abreviado + ordinario)", "ilustracion": "sustentacion-audiencia.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "sustentacion-audiencia.webp", "pos": "fondo"}}, {"layout": "esquema", "segmentos": ["Si el concurso de conductas punibles está constituido única y exclusivamente por delitos contemplados en el catálogo del artículo 534 (por ejemplo, un concurso entre VIF, hurto calificado e inasistencia alimentaria), la actuación se mantendrá en su totalidad bajo las reglas del procedimiento penal especial abreviado de la Ley 1826 de 2017.", "Alerta: La inobservancia de la regla de prevalencia del procedimiento ordinario genera una irregularidad sustancial en el trámite procesal. Si quien ejerce como fiscal procesa un concurso mixto (ordinario + abreviado) a través de la Ley 1826, está actuando sin competencia funcional para ese trámite específico. Esto vicia de nulidad absoluta toda la actuación, desde el traslado del escrito de acusación, por violación al debido proceso (juez natural y formas propias de cada juicio), conforme al artículo 457 del CPP."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "artículo 534", "segs": [0], "obj": "libros"}, {"label": "Alerta", "segs": [1], "obj": "escalones"}]}], "rotulo": null, "seccion": "2. Regla del concurso homogéneo o pluralidad de delitos abreviados (abreviado + abreviado).", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["artículo 534", "Alerta"], "titulo_genially": "Regla del concurso homogéneo o pluralidad de delitos abreviados (abreviado + abreviado).", "ilustracion": "p-trio-2.webp", "relleno": "entrega-carpeta.webp", "arte": {"img": "p-trio-2.webp", "pos": "izq"}}, {"layout": "lamina", "segmentos": ["Uno de los desafíos técnicos más complejos en la práctica judicial para fiscales y asistentes es la delimitación de los HJR. La Corte Constitucional, en decisiones de unificación como la Sentencia SU-360 de 2024, y la Sala Penal de la Corte Suprema de Justicia han insistido en que la correcta formulación de los HJR es la columna vertebral del debido proceso y del derecho a la defensa."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Sentencia SU-360 de 2024", "segs": [0], "obj": "libros", "acomp": ["personas", "documento"]}]}], "rotulo": null, "seccion": "3. Adecuación típica y delimitación de HJR", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Sentencia SU-360 de 2024"], "titulo_genially": "Adecuación típica y delimitación de HJR", "ilustracion": "p-dialogo-carpeta.webp", "relleno": "lee-libro-explica.webp", "arte": {"img": "p-dialogo-carpeta.webp", "pos": "izq"}}, {"layout": "esquema", "segmentos": ["En el sistema procesal penal colombiano (Ley 906 de 2004), el grado de conocimiento lógico exigido a la Fiscalía evoluciona de manera progresiva a lo largo de las distintas etapas de la actuación para salvaguardar el debido proceso y evitar la arbitrariedad en el ejercicio del poder punitivo del Estado. El estándar de probabilidad de verdad, consagrado en el artículo 336 de la Ley 906 de 2004, constituye el umbral de conocimiento requerido específicamente para la fase de acusación.", "Además, es el punto de inflexión en el procedimiento penal abreviado, pues el traslado del escrito de acusación se ubica en este estándar al suprimir la imputación.", "En el proceso penal se establece así el estándar probabilidad de verdad sobre el delito y la responsabilidad penal del acusado:", "a) El estándar lógico. Probabilidad de verdad, siguiendo el artículo 336 de la Ley 906 de 2004. Requisito formal y probatorio: la presentación de la acusación no es un acto formal que pueda realizarse en cualquier momento o de cualquier manera. Exige un juicio de suficiencia en el que el fiscal valore el material de convicción recaudado. Sustento fáctico: el escrito acusatorio solo puede presentarse cuando sea posible afirmar dicha probabilidad a partir de los elementos materiales probatorios, evidencia física o información legalmente obtenida.", "Núcleo del estándar: La probabilidad de verdad debe recaer de forma concomitante sobre dos aspectos:", "1.​ Que la conducta delictiva existió.", "2.​ Que la persona imputada es su autora o partícipe.", "b) Escala del grado de conocimiento lógico en el proceso penal La probabilidad de verdad del artículo 336 del CPP se puede contratar con los otros niveles de conocimiento lógico que guían el proceso penal de tendencia acusatoria así:", "1. Motivos razonablemente fundados (art. 220 del CPP): son el fundamento para la orden de registro y allanamiento, retención de correspondencia (art. 233 del CPP), interceptación de comunicaciones (art. 235 del CPP), recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones (art. 236 del CPP) y captura (art. 297 del CPP)."], "parrafo": [0, 2, 3, 5, 6, 7, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "grado de conocimiento lógico exigido", "segs": [0, 1], "obj": "libros"}, {"label": "así el estándar probabilidad de verdad", "segs": [2, 3, 4, 5], "obj": "escalones"}, {"label": "persona imputada", "segs": [6], "obj": "personas"}, {"label": "Escala del grado de conocimiento lógico", "segs": [7, 8], "obj": "casa"}]}], "rotulo": null, "seccion": "4. La probabilidad de verdad del delito y la responsabilidad penal para delimitar la acusación", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["grado de conocimiento lógico exigido", "así el estándar probabilidad de verdad", "persona imputada", "Escala del grado de conocimiento lógico"], "titulo_genially": "La probabilidad de verdad del delito y la responsabilidad penal para delimitar la acusación", "ilustracion": "p-lee-libro.webp", "relleno": "entrega-carpeta.webp", "arte": {"img": "p-lee-libro.webp", "pos": "der"}}, {"layout": "rejilla", "segmentos": ["2. Inferencia razonable (imputación y traslado de acusación: es el estándar inicial y menos exigente. Se aplica en la etapa de formulación de imputación o en el traslado del escrito de acusación en el procedimiento abreviado. En este, la Fiscalía, basándose en la información temprana de la indagación, infiere razonablemente la adecuación típica para vincular formalmente a la persona procesada (art. 286 del CPP sobre el presupuesto de imputación que se omite en el procedimiento penal abreviado y art. 308 del CPP que trata los requisitos para la medida de aseguramiento).", "3. Probabilidad de verdad (acusación): es el estándar intermedio (art. 336 del CPP). Al haber concluido la fase de investigación se exige un nivel cognitivo superior a la mera inferencia inicial, indispensable para autorizar la apertura de la etapa de juicio que corresponde si inicio a la Fiscalía en el acto complejo de acusación en el procedimiento ordinario (que se concreta en los momentos de presentación del escrito y celebración de la audiencia del Artículo 339 CPP).", "4. Conocimiento más allá de toda duda razonable (sentencia condenatoria): es el estándar cognitivo final del artículo 381 del CPP. Corresponde a quien ejerce como juez de conocimiento. Es el nivel de certeza exigido constitucional y legalmente al juez de conocimiento para poder derribar la presunción de inocencia y proferir una sentencia condenatoria tanto sobre la materialidad del delito como sobre la responsabilidad del acusado.", "Ese escalonamiento lógico y probatorio asegura que el proceso avance solo cuando se consolida la hipótesis criminal de la Fiscalía. Esto protege tanto la presunción de inocencia de quien es procesado como el derecho de las víctimas a una correcta administración de justicia basada en la tipicidad estricta, cuya piedra angular es la demostración de los llamados HJR"], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Inferencia razonable (imputación y traslado de acusación", "segs": [0], "obj": "lupa", "ilus": "entrega-carpeta.webp"}, {"label": "Probabilidad de verdad (acusación)", "segs": [1], "obj": "escalones", "ilus": "terminos-reloj.webp"}, {"label": "Conocimiento más allá de toda duda razonable", "segs": [2], "obj": "libros", "ilus": "lee-libro-explica.webp"}, {"label": "Ese escalonamiento lógico y probatorio asegura", "segs": [3], "obj": "telefono", "ilus": "dialogo-carpeta.webp"}]}], "rotulo": null, "seccion": "4. La probabilidad de verdad del delito y la responsabilidad penal para delimitar la acusación", "grupo": null, "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Inferencia razonable (imputación y traslado de acusación", "Probabilidad de verdad (acusación)", "Conocimiento más allá de toda duda razonable", "Ese escalonamiento lógico y probatorio asegura"], "titulo_genially": "La probabilidad de verdad del delito y la responsabilidad penal para delimitar la acusación", "ilustracion": "investigacion-lupa.webp", "relleno": "revisan-documento.webp"}, {"layout": "esquema", "segmentos": ["Los HJR son las premisas fácticas de la acusación que encajan con los elementos objetivos, subjetivos y normativos de la descripción típica prevista por el legislador en el delito en particular.", "Cada elemento del tipo penal debe tener una correspondencia exacta con un hecho del mundo real descrito en la acusación.", "En ese sentido, constituyen la descripción fáctica y precisa de los sucesos atribuidos a un individuo, los cuales deben correlacionarse de manera exacta con los elementos estructurales de un tipo penal (adecuación típica o juicio de imputación)[^4].", "[^4] Corte Constitucional, Sentencia SU360 de 2024.", "M.P. Reyes Cuartas."], "parrafo": [0, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "premisas fácticas de la acusación", "segs": [0], "obj": "documento"}, {"label": "Cada elemento del tipo penal", "segs": [1], "obj": "carpetas"}, {"label": "constituyen la descripción fáctica y precisa", "segs": [2], "obj": "lupa"}, {"label": "Corte Constitucional", "segs": [3], "obj": "libros"}, {"label": "M.P. Reyes Cuartas", "segs": [4], "obj": "expediente"}]}], "rotulo": null, "seccion": "5. ¿Qué es un HJR en la acusación?", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["premisas fácticas de la acusación", "Cada elemento del tipo penal", "constituyen la descripción fáctica y precisa", "Corte Constitucional", "M.P. Reyes Cuartas"], "titulo_genially": "¿Qué es un HJR en la acusación?", "ilustracion": "explica-brazos.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "explica-brazos.webp", "pos": "fondo"}}, {"layout": "puntos", "segmentos": ["Quien ejerce como fiscal debe distinguir tres conceptos al momento de concretar su acusación:", "a) Los HJR: el dato fáctico específico que realiza el tipo penal (ejemplo: Pedro se apoderó de la billetera de Juan el 15 de marzo de 2026 sin su consentimiento).", "b) Los hechos indicadores (inferencias): datos fácticos colaterales de los que se puede inferir el HJR (ejemplo: Pedro corría por la calle con una billetera en la mano inmediatamente después del hecho).", "c) Los elementos materiales probatorios, la evidencia física y la información legalmente obtenida: son los instrumentos a través de los cuales se pretende demostrar la ocurrencia del hecho indicador o del HJR (ejemplo: el testimonio de Juan o el video de la cámara de seguridad).", "Alerta: La transcripción de testimonios, la narración exhaustiva del desarrollo de la investigación o el listado de las pruebas obtenidas en la sección de hechos del escrito de acusación constituyen un error técnico. Los hechos del escrito de acusación deben contener exclusivamente afirmaciones fácticas que correspondan a la conducta punible imputada."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Quien ejerce como fiscal", "segs": [0, 1], "obj": "documento"}, {"label": "Los hechos indicadores (inferencias)", "segs": [2], "obj": "lupa"}, {"label": "elementos materiales probatorios", "segs": [3], "obj": "camara"}, {"label": "Alerta", "segs": [4], "obj": "expediente"}]}], "rotulo": null, "seccion": "6. Precisiones conceptuales.", "grupo": null, "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Quien ejerce como fiscal", "Los hechos indicadores (inferencias)", "elementos materiales probatorios", "Alerta"], "titulo_genially": "Precisiones conceptuales.", "ilustracion": "investigacion-lupa.webp", "relleno": "corren-carpetas.webp"}, {"layout": "esquema", "segmentos": ["Dado que en el procedimiento abreviado no existe una audiencia de formulación de imputación, el traslado del escrito de acusación es el único y definitivo escenario de delimitación fáctica y tipificación jurídica inicial.", "Quien ejerce como fiscal debe plasmar en dicho escrito los HJR sin vaguedad o ambigüedad.", "En este momento procesal se concreta el derecho a la información[^5], pues la defensa debe prepararde manera adecuada y acorde con ello su teoría del caso, para lo que dispone de 60 días conforme con el artículo 541 del CPP.", "Una equivoca redacción de los HJR en la acusación puede dar lugar a que la defensa formule solicitudes de nulidad en la audiencia concentrada, que estarán fundadas en la vulneración al debido proceso y el derecho a la defensa.", "[^5] Ley 906 de 2004 Artículo 8, Lit. h) Conocer los cargos que le sean imputados, expresados en términos que sean comprensibles, con indicación expresa de las circunstancias conocidas de modo, tiempo y lugar que los fundamentan;"], "parrafo": [0, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "traslado del escrito de acusación", "segs": [0], "obj": "tribunal"}, {"label": "Quien ejerce como fiscal", "segs": [1], "obj": "documento"}, {"label": "artículo 541 del CPP", "segs": [2], "obj": "reloj"}, {"label": "equivoca redacción de los HJR", "segs": [3], "obj": "personas"}, {"label": "Ley 906 de 2004 Artículo 8", "segs": [4], "obj": "libros"}]}], "rotulo": null, "seccion": "7. Los HJR en el procedimiento abreviado.", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["traslado del escrito de acusación", "Quien ejerce como fiscal", "artículo 541 del CPP", "equivoca redacción de los HJR", "Ley 906 de 2004 Artículo 8"], "titulo_genially": "Los HJR en el procedimiento abreviado.", "ilustracion": "p-explica-brazos-2.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "p-explica-brazos-2.webp", "pos": "izq"}}]}</script>
