<script type="application/json" id="contenido">{"unit": 1, "lesson": 5, "heading": "Lección 5. Querella y conciliación como requisitos de procedibilidad", "scenes": [{"layout": "lamina", "segmentos": ["Objetivo de la lección: Analizar e identificar la querella y la conciliación preprocesal como barreras y presupuestos obligatorios de procedibilidad en el procedimiento penal especial abreviado (Ley 1826 de 2017), así como verificar los términos de caducidad y los efectos jurídicos del intento de acuerdo en los delitos del grupo I (querellables), para evitar la indebida exigencia de estos requisitos o la aplicación errónea de la caducidad en los delitos investigables de oficio del grupo II."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 5. Querella y conciliación como requisitos de procedibilidad", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Querella y conciliación como requisitos de procedibilidad"}, {"layout": "lamina", "segmentos": ["Para los delitos del grupo I (querellables), el legislador ha impuesto dos barreras procedimentales que quien ejerce como fiscal debe verificar rigurosamente antes de realizar cualquier acto de vinculación procesal: la caducidad de la querella y el requisito de procedibilidad de la conciliación previa."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "dos barreras procedimentales", "segs": [0], "obj": "escalones"}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["dos barreras procedimentales"], "titulo_genially": "Introducción"}, {"layout": "giro", "segmentos": ["De conformidad con el artículo 73 del CPP, la querella debe presentarse dentro del término perentorio de seis meses, contados a partir de la ocurrencia de la conducta punible. Si la víctima legítima no formula la querella en ese lapso, opera el fenómeno sustancial de la caducidad, el cual extingue la acción penal e imposibilita cualquier persecución penal por el Estado.", "El o la fiscal que reciba una noticia criminal por un delito querellable presentado fuera del término de caducidad debe abstenerse de iniciar investigación y emitir de inmediato una orden de archivo o solicitar la preclusión, según sea el estado de la actuación. Avanzar en un trámite abreviado con una querella caducada constituye una violación directa de la ley procesal."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "artículo 73 del CPP", "segs": [0], "obj": "reloj"}, {"label": "fuera del término de caducidad", "segs": [1], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "1. Caducidad de la querella", "grupo": null, "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["artículo 73 del CPP", "fuera del término de caducidad"], "titulo_genially": "Caducidad de la querella"}, {"layout": "mapa", "segmentos": ["Para los delitos querellables, la ley exige agotar un intento de conciliación entre la víctima y el indiciado antes de proceder al traslado del escrito de acusación. Este trámite se rige por las siguientes pautas institucionales:", "a) Citación a conciliación: la Fiscalía, o un centro de conciliación autorizado (público o privado), debe citar a las partes a audiencia formal de conciliación.", "b) Resultado favorable (acuerdo): si las partes llegan a un acuerdo conciliatorio y este se cumple se suscribe el acta respectiva. Esto da lugar a la extinción de la acción penal y el consecuente archivo definitivo de las diligencias.", "c) Resultado desfavorable (no acuerdo o inasistencia): si las partes asisten, pero no concilian, o si alguna de ellas no asiste injustificadamente tras ser debidamente citada, quien ejerce como fiscal o conciliador dejará constancia de ello en un acta de no acuerdo o inasistencia. Este documento perfecciona la condición de procedibilidad, habilitando formalmente a la Fiscalía para proceder al traslado del escrito de acusación.", "Alerta: La caducidad de la querella de seis meses y el requisito de procedibilidad de conciliación previa solo aplican a los delitos querellables (art. 74 del CPP). No son aplicables a los delitos de investigación de oficio incluidos en el catálogo del artículo 534 numeral 2 (como VIF, inasistencia alimentaria o hurto calificado). En estos delitos de oficio, quien ejerce como fiscal no requiere conciliación previa para formular acusación y la acción penal no caduca a los seis meses (se rige por los términos generales de prescripción de la acción penal de la Ley 599 de 2000)."], "parrafo": [0, 1, 2, 3, 4], "vineta": [1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "intento de conciliación entre la víctima", "segs": [0, 1], "obj": "escudo", "centro": true}, {"label": "Resultado favorable (acuerdo)", "segs": [2], "obj": "carpetas"}, {"label": "Resultado desfavorable (no acuerdo o inasistencia)", "segs": [3], "obj": "documento"}, {"label": "Alerta", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "2. Conciliación como requisito de procedibilidad", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["intento de conciliación entre la víctima", "Resultado favorable (acuerdo)", "Resultado desfavorable (no acuerdo o inasistencia)", "Alerta"], "titulo_genially": "Conciliación como requisito de procedibilidad"}, {"layout": "ruta", "segmentos": ["Según la práctica judicial, la redacción de la acusación es plasmar la teoría del delito en el caso concreto. Por esta razón, para las etapas iniciales del procedimiento penal abreviado son frecuentes los errores de apreciación jurídica por parte de los operadores judiciales. A continuación, se detallan los errores más comunes identificados en las fiscalías delegadas y sus consecuencias procesales:", "a) Tramitar un concurso de delitos mixto bajo el procedimiento abreviado: ocurre cuando quien ejerce como fiscal, al observar que uno de los delitos es de alta relevancia (por ejemplo, hurto calificado y agravado), decide tramitarlo bajo la Ley 1826 de 2017 sin advertir que concurre con un delito no incluido en el catálogo (por ejemplo, fabricación, tráfico o porte de armas de fuego). Ello se traduce en un trámite absolutamente nulo. Al violar la regla de prevalencia del procedimiento ordinario, el proceso se retrotrae hasta el momento del traslado de acusación, lo que obliga a reiniciar la actuación bajo la Ley 906 de 2004.", "b) Aplicar la caducidad de la querella a delitos de oficio del catálogo abreviado: es un error interpretativo muy recurrente en el que se confunde procedimiento abreviado con procedimiento querellable. Consiste en ordenar el archivo de una investigación por VIF o inasistencia alimentaria bajo el argumento de que la denuncia se presentó después de transcurridos seis meses desde la ocurrencia de los hechos. Se incurre en denegación de justicia y prevaricato por omisión. Se archiva de forma manifiestamente ilegal una conducta de oficio de alta sensibilidad social, vulnerando gravemente los derechos de las víctimas y la política criminal del Estado.", "c) Trasladar el escrito de acusación sin agotar la conciliación en delitos querellables: consiste en omitir la citación formal a conciliación o realizar el traslado de acusación estando pendiente la resolución de la diligencia de conciliación para conductas de lesiones personales simples o daño en bien ajeno, con el argumento de tener razones de celeridad o descongestión. La consecuencia procesal es la inadmisión de la acusación o decreto de nulidad por falta del requisito de procedibilidad. En la audiencia concentrada, quien ejerce como juez de conocimiento debe declarar la invalidez como sanción de lo actuado defectuosamente desde el traslado del escrito de acusación, esto por faltar un presupuesto legal obligatorio.", "d) Confundir los HJR con hechos de la denuncia, hechos de la prueba o hechos indicadores: ocurre cuando el redactor del escrito de acusación, en lugar de realizar una síntesis de la conducta típica y los cargos objeto de acusación, transcribe íntegramente la denuncia, las entrevistas o copia los informes de policía judicial en el acápite de hechos. En este caso, el escrito de acusación será objeto de reiteradas observaciones de imprecisión en la audiencia concentrada. En el peor de los escenarios, la indeterminación de los cargos impide al juez proferir una sentencia condenatoria congruente, lo que fuerza la absolución por falta de claridad en la acusación."], "parrafo": [0, 1, 2, 3, 4], "vineta": [1, 2, 3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "redacción de la acusación", "segs": [0], "obj": "escalones"}, {"label": "Tramitar un concurso de delitos mixto bajo", "segs": [1], "obj": "libros"}, {"label": "Aplicar la caducidad de la querella", "segs": [2], "obj": "lupa"}, {"label": "Trasladar el escrito de acusación sin agotar", "segs": [3], "obj": "reloj"}, {"label": "Confundir los HJR con hechos", "segs": [4], "obj": "expediente"}]}], "rotulo": null, "seccion": "3. A tener en cuenta: errores frecuentes de tipificación que llevan a rutas procesales inadecuadas", "grupo": null, "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["redacción de la acusación", "Tramitar un concurso de delitos mixto bajo", "Aplicar la caducidad de la querella", "Trasladar el escrito de acusación sin agotar", "Confundir los HJR con hechos"], "titulo_genially": "A tener en cuenta: errores frecuentes de tipificación que llevan a rutas procesales inadecuadas"}]}</script>
